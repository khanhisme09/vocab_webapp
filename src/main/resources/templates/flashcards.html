<main class="container w-100 w-lg-75 mx-auto py-5">

    <div class="d-flex justify-content-start gap-5 align-items-center mb-4">
        <a th:href="@{/my-lists/{listId}(listId=${listId})}"
           class="btn btn-outline-primary">
            &larr; Back to List
        </a>
        <button id="prev-btn" class="btn btn-secondary">Previous</button>
        <p class="mb-0 fw-bold" id="progress-text">1 / X</p>
        <button id="next-btn" class="btn btn-primary">Next</button>
    </div>


    <!-- Flashcard Scene -->
    <div class="flashcard-scene mb-4">
        <div class="flashcard " id="flashcard">
            <!-- Front -->
            <div class="flashcard-face flashcard-face--front p-2 border rounded-5 shadow-sm text-center">
                <span class="word-text h3 d-block mb-2" id="card-front-text">Word</span>
                <div class="phonetic-block d-flex justify-content-center align-items-center gap-2">
                    <span id="card-front-phonetic">/fəˈnɛtɪk/</span>
                    <button class="btn btn-outline-secondary btn-sm" id="audio-btn-front">🔊</button>
                </div>
            </div>
            <!-- Back -->
            <div class="flashcard-face flashcard-face--back p-2 border rounded-5 shadow-sm text-center mt-3" id="card-back-text">
                Definition
            </div>
        </div>
    </div>
</main>
