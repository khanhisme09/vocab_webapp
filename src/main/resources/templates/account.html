<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/_header :: page_head('My Account')}"></head>

<body>
<div th:replace="~{fragments/_header :: navbar}"></div>

<main class="container">
    <h1 class="mb-4">My Account</h1>

    <div class="row g-4">
        <!-- CỘT BÊN TRÁI: PROFILE VÀ THÀNH TÍCH -->
        <div class="col-lg-4">
            <!-- Card thông tin cá nhân -->
            <div class="card mb-4">
                <div class="card-body text-center">
                    <i class="bi bi-person-circle" style="font-size: 5rem;"></i>
                    <h4 class="card-title mt-3" th:text="${user.username}">Username</h4>
                    <p class="card-text text-muted" th:text="${user.email}">user@example.com</p>
                </div>
            </div>

            <!-- Card thành tích học tập -->
            <div class="card">
                <div class="card-header fw-bold">
                    Learning Achievements
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Words Learned
                        <span class="badge bg-primary rounded-pill" th:text="${stats.totalUniqueWords}">0</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Words Mastered
                        <!-- Giả định 'Mastered' là một level trong stats -->
                        <span class="badge bg-success rounded-pill" th:text="${stats.wordsBySrsLevel['Mastered'] ?: 0}">0</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Lists Created
                        <span class="badge bg-info rounded-pill" th:text="${stats.totalLists}">0</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- CỘT BÊN PHẢI: CÀI ĐẶT TÀI KHOẢN -->
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    Account Settings
                </div>
                <div class="card-body">
                    <!-- NÚT ĐỂ BẬT/TẮT FORM -->
                    <a class="btn btn-outline-secondary" data-bs-toggle="collapse" href="#changePasswordCollapse" role="button" aria-expanded="false" aria-controls="changePasswordCollapse">
                        <i class="bi bi-key-fill me-2"></i> Change Password
                    </a>

                    <!-- FORM THAY ĐỔI MẬT KHẨU - MẶC ĐỊNH BỊ THU GỌN -->
                    <div class="collapse mt-3" id="changePasswordCollapse">
                        <hr>
                        <form th:action="@{/account/change-password}" th:object="${passwordChangeDto}" method="post">
                            <div class="mb-3">
                                <label for="oldPassword" class="form-label">Current Password</label>
                                <input type="password" id="oldPassword" th:field="*{oldPassword}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password</label>
                                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" required>
                                <div class="form-text">Must be at least 6 characters long.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </form>
                    </div>

                    <!-- (Tùy chọn) Thêm các cài đặt khác ở đây -->
                    <hr>
                    <div class="mt-3">
                        <button class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i> Delete Account
                        </button>
                        <div class="form-text">This action is irreversible.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/_footer :: page_footer}"></div>
<div th:replace="~{fragments/_footer :: bootstrap_script}"></div>
<div th:replace="~{fragments/_footer :: toast_logic}"></div>
</body>
</html>
