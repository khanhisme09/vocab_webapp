<!-- ==================== LOGIC TOAST TOÀN CỤC ==================== -->
<th:block th:fragment="toast_logic">
    <!-- Tải file handler -->
    <script th:src="@{/js/toast-handler.js}"></script>
    <!-- Script inline để đọc flash attributes từ model và gọi handler -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const successMessage = /*[[${toast_success}]]*/ null;
        const warningMessage = /*[[${toast_warning}]]*/ null;
        const errorMessage = /*[[${toast_error}]]*/ null;

        document.addEventListener('DOMContentLoaded', () => {
            // Logic giờ chỉ là kiểm tra và hiển thị, không cần lắp ráp gì nữa
            if (successMessage) {
                showToast(successMessage, 'success');
            }
            if (warningMessage) {
                showToast(warningMessage, 'warning');
            }
            if (errorMessage) {
                showToast(errorMessage, 'danger');
            }
        });
        /*]]>*/
    </script>
</th:block>
