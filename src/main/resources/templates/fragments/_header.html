<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="page_head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' - VocabMaster'">VocabMaster</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <th:block th:replace="${cssFiles} ?: ~{}"></th:block>

    <!-- Placeholder cho các file script trong head -->
    <th:block th:replace="${headScripts} ?: ~{}"></th:block>
</head>

<body>
<header th:fragment="navbar" class="py-2 bg-light border-bottom">
    <div class="container d-flex flex-wrap justify-content-center">
        <a th:href="@{/}" class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto link-body-emphasis text-decoration-none">
            <span class="fs-4 fw-bold">VocabMaster</span>
        </a>

        <ul class="nav nav-pills align-items-center"> <!-- Thêm align-items-center để căn giữa theo chiều dọc -->
            <li class="nav-item">
                <!-- Bỏ flex-column, thêm align-items-center và gap-2 -->
                <a th:href="@{/}" class="nav-link d-flex align-items-center gap-2">
                    <i class="bi bi-search"></i>
                    <span>Dictionary</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/my-lists}" class="nav-link d-flex align-items-center gap-2">
                    <i class="bi bi-card-list"></i>
                    <span>My Lists</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/quiz}" class="nav-link d-flex align-items-center gap-2">
                    <i class="bi bi-check2-square"></i>
                    <span>Practice</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard}" class="nav-link d-flex align-items-center gap-2">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- Phần đăng nhập/đăng ký và dropdown -->
            <!-- Thêm một đường kẻ dọc để phân tách -->
            <li class="nav-item ms-3 me-2" sec:authorize="isAuthenticated()"><div class="vr"></div></li>

            <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                <a href="#" class="nav-link dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="d-none d-lg-inline me-2" sec:authentication="name"></span>
                    <i class="bi bi-list fs-5"></i>
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><h6 class="dropdown-header">Hello, <b sec:authentication="name">User</b>!</h6></li>
                    <li><a class="dropdown-item" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>My Dashboard</a></li>
                    <li><a class="dropdown-item" th:href="@{/my-lists}"><i class="bi bi-card-list me-2"></i>My Lists</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Log out</button>
                        </form>
                    </li>
                </ul>
            </li>

            <li class="nav-item ms-2" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="nav-link">Log In</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a th:href="@{/register}" class="btn btn-primary">Sign Up</a>
            </li>

        </ul>
    </div>
</header>
</body>
</html>
