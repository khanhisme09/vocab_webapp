<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Word Details</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
        .word-header h1 { display: inline; margin-right: 20px;}
        .phonetic { color: #555; }
        .meaning-block { border-left: 4px solid #007bff; padding-left: 20px; margin-top: 30px; }
        h3 { font-style: italic; color: #333; }
        ul { list-style-type: disc; padding-left: 20px; }
        li { margin-bottom: 10px; }
        .example { color: #777; font-style: italic; margin-top: 5px; }
        .error { color: red; }
        a { color: #007bff; text-decoration: none; }
        .save-form { margin-top: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
<a href="/">&larr; Back to Search</a>

<!-- Khối hiển thị lỗi -->
<div th:if="${error}">
    <h2 class="error" th:text="${error}">Error message will be here</h2>
</div>

<!-- Khối hiển thị dữ liệu từ -->
<div th:if="${wordData}">
    <div class="word-header">
        <h1 th:text="${wordData.word}">Word</h1>
        <th:block th:each="phonetic : ${wordData.phonetics}">
            <!-- Chỉ hiển thị khối này nếu có phiên âm dạng text -->
            <div class.phonetic-block th:if="${phonetic.text}">
                <span th:text="${phonetic.text}"></span>
                <!-- Nút 1: Dùng link audio từ API nếu có -->
                <button class="audio-btn" th:if="${phonetic.audio}" th:data-audio-url="${phonetic.audio}">🔊</button>
                <!-- Nút 2: Dùng Web Speech API nếu không có link -->
                <button class="audio-btn" th:unless="${phonetic.audio}" th:data-word="${wordData.word}">🔊</button>
            </div>
        </th:block>
    </div>

    <!-- ========== KHỐI THAY ĐỔI CHÍNH BẮT ĐẦU TỪ ĐÂY ========== -->
    <div sec:authorize="isAuthenticated()" class="save-form">
        <h3>Save this word</h3>
        <form th:action="@{/my-lists/add-word}" method="post">
            <input type="hidden" name="word" th:value="${wordData.word}">

            <div>
                <input type="radio" id="choice-existing" name="listChoice" value="existing" checked onchange="toggleListInput()">
                <label for="choice-existing">Add to existing list:</label>
                <label for="list-select"></label><select name="listId" id="list-select">
                    <option th:if="${#lists.isEmpty(userLists)}" disabled>You have no lists yet</option>
                    <option th:each="list : ${userLists}" th:value="${list.id}" th:text="${list.name}">List Name</option>
                </select>
            </div>

            <div>
                <input type="radio" id="choice-new" name="listChoice" value="new" onchange="toggleListInput()">
                <label for="choice-new">Create a new list:</label>
                <input type="text" name="newListName" id="new-list-name" placeholder="Enter new list name..." style="display:none;">
            </div>

            <button type="submit" style="margin-top: 10px;">Save Word</button>
        </form>

        <script>
            function toggleListInput() {
                if (document.getElementById('choice-new').checked) {
                    document.getElementById('new-list-name').style.display = 'inline-block';
                    document.getElementById('list-select').disabled = true;
                    document.getElementById('new-list-name').required = true;
                } else {
                    document.getElementById('new-list-name').style.display = 'none';
                    document.getElementById('list-select').disabled = false;
                    document.getElementById('new-list-name').required = false;
                }
            }
            toggleListInput();
        </script>
    </div>
    <!-- ========== KẾT THÚC KHỐI THAY ĐỔI ========== -->

    <div th:each="meaning : ${wordData.meanings}" class="meaning-block">
        <h3 th:text="${meaning.partOfSpeech}">Part of Speech</h3>
        <ul>
            <li th:each="def : ${meaning.definitions}">
                <span th:text="${def.definition}">This is the definition of the word.</span>
                <div th:if="${def.example}" class="example">
                    " <span th:text="${def.example}">Example sentence.</span> "
                </div>
            </li>
        </ul>
    </div>
</div>
<script>

    document.addEventListener('click', (event) => {
        if (!event.target.classList.contains('audio-btn')) return;

        const audioUrl = event.target.dataset.audioUrl;
        const word = event.target.dataset.word;
        const audioPlayer = new Audio();

        if (audioUrl) {
            audioPlayer.src = audioUrl;
            audioPlayer.play();
        } else if (word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Your browser does not support Text-to-Speech.');
            }
        }
    });


</script>
</body>
</html>
