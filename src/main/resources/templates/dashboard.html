<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/_header :: page_head('Dashboard')}"></head>

<body>
<div th:replace="~{fragments/_header :: navbar}"></div>

<main class="container">
    <h1 class="mb-4">My Learning Dashboard</h1>

    <div class="row g-4">
        <!-- CỘT BÊN TRÁI: THỐNG KÊ SRS VÀ HOẠT ĐỘNG GẦN ĐÂY -->
        <div class="col-lg-8">
            <!-- Card ôn tập -->
            <div class="card text-white bg-primary mb-4">
                <div class="card-body">
                    <h5 class="card-title">Time to Review!</h5>
                    <p class="card-text fs-5">You have <b id="words-to-review">...</b> words ready for practice.</p>
                </div>
            </div>

            <!-- Card hoạt động 7 ngày -->
            <div class="card mb-4">
                <div class="card-header fw-bold">Learning Activity (Last 7 Days)</div>
                <div class="card-body">
                    <canvas id="learningActivityChart"></canvas>
                </div>
            </div>

            <!-- Card từ mới thêm gần đây -->
            <div class="card " >
                <div class="card-header" style="background-color: #0d6efd; color: white;">
                    <span class="fw-bold fs-5">Recently Added Words</span>
                </div>
                <ul class="list-group list-group-flush" id="recently-added-list">
                    <!-- JS sẽ điền vào đây -->
                </ul>
            </div>
        </div>

        <!-- CỘT BÊN PHẢI: TỔNG QUAN -->
        <div class="col-lg-4">
            <!-- Card phân loại từ vựng -->
            <div class="card mb-4">
                <div class="card-header fw-bold">Vocabulary Breakdown</div>
                <div class="card-body">
                    <canvas id="srsBreakdownChart"></canvas>
                </div>
            </div>

            <!-- Card thống kê tổng quan -->
            <div class="card">
                <div class="card-header fw-bold">Overall Stats</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Total Unique Words
                        <span class="badge bg-primary rounded-pill" id="total-unique-words">...</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Total Lists
                        <span class="badge bg-primary rounded-pill" id="total-lists">...</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/_footer :: page_footer}"></div>
<div th:replace="~{fragments/_footer :: bootstrap_script}"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/dashboard/stats')
            .then(response => response.json())
            .then(data => {
                // Cập nhật các thẻ số liệu
                document.getElementById('total-unique-words').innerText = data.totalUniqueWords;
                document.getElementById('total-lists').innerText = data.totalLists;
                document.getElementById('words-to-review').innerText = data.wordsToReviewToday;

                // const reviewBtn = document.getElementById('start-review-btn');
                // if (data.wordsToReviewToday > 0) {
                //     reviewBtn.disabled = false;
                // }

                // Điền danh sách từ mới
                const recentList = document.getElementById('recently-added-list');
                if (data.recentlyAddedWords.length > 0) {
                    data.recentlyAddedWords.forEach(word => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.innerText = word;
                        recentList.appendChild(li);
                    });
                } else {
                    recentList.innerHTML = '<li class="list-group-item text-muted">No recent activity.</li>';
                }

                // Vẽ biểu đồ phân loại SRS (Doughnut Chart)
                const srsCtx = document.getElementById('srsBreakdownChart').getContext('2d');
                new Chart(srsCtx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.wordsBySrsLevel),
                        datasets: [{
                            data: Object.values(data.wordsBySrsLevel),
                            backgroundColor: ['#0d6efd', '#ffc107', '#fd7e14', '#198754'],
                        }]
                    },
                    options: { responsive: true }
                });

                // Vẽ biểu đồ hoạt động 7 ngày (Bar Chart)
                const activityCtx = document.getElementById('learningActivityChart').getContext('2d');
                new Chart(activityCtx, {
                    type: 'bar',
                    data: {
                        labels: data.wordsLearnedLast7Days.map(d => new Date(d.date).toLocaleDateString('en-US', { weekday: 'short' })),
                        datasets: [{
                            label: 'Words Added',
                            data: data.wordsLearnedLast7Days.map(d => d.count),
                            backgroundColor: 'rgba(13, 110, 253, 0.5)',
                            borderColor: 'rgba(13, 110, 253, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
                });
            })
            .catch(error => console.error('Error fetching dashboard stats:', error));
    });
</script>
</body>
</html>
