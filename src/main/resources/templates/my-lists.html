<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/_header :: page_head('My Lists')}"></head>

<body>
<div th:replace="~{fragments/_header :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Vocabulary Lists</h1>
        <!-- Nút này có thể dùng để tạo list mới trực tiếp trong tương lai -->
        <!-- <a href="#" class="btn btn-primary">Create New List</a> -->
    </div>

    <!-- Hiển thị các list dưới dạng grid -->
    <div th:if="${!#lists.isEmpty(lists)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="list : ${lists}" class="col">
            <div class="card h-100 shadow-sm list-card">
                <div class="card-body d-flex flex-column">

                    <div class="d-flex justify-content-between">
                        <h5 class="card-title" th:text="${list.name}">List Name</h5>
                        <!-- Menu hành động (...) -->
                        <div class="dropdown actions-dropdown">
                            <button class="btn btn-sm btn-link text-muted" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{/my-lists/{listId}(listId=${list.id})}"><i class="bi bi-pencil-square me-2"></i>Edit & View</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/my-lists/{listId}/delete(listId=${list.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this list and all its words? This cannot be undone.');">
                                        <button type="submit" class="dropdown-item text-danger"><i class="bi bi-trash me-2"></i>Delete List</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <p class="card-text text-muted small">
                        <span th:text="${#lists.size(list.listWords)}">0</span> words
                    </p>

                    <!-- Hiển thị 3 từ mẫu -->
                    <div th:if="${!#lists.isEmpty(list.listWords)}">
                        <p class="small mb-1">Includes:</p>
                        <ul class="list-unstyled sample-words-list">
                            <!--
                                Sử dụng một khối th:block để lặp.
                                Bên trong, thẻ li chỉ được render nếu index < 3.
                            -->
                            <th:block th:each="listWord, iterStat : ${#lists.toList(list.listWords)}">
                                <li th:if="${iterStat.index < 3}" th:text="${listWord.word.wordText}">
                                    Sample word
                                </li>
                            </th:block>

                            <li th:if="${#lists.size(list.listWords) > 3}">...and more</li>
                        </ul>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{/lists/{listId}/flashcards(listId=${list.id})}" class="btn btn-primary flex-fill">
                            <i class="bi bi-layers-fill me-2"></i> Practice with Flashcards
                        </a>

                        <form th:action="@{/quiz/start}" method="post" class="flex-fill m-0">
                            <input type="hidden" name="listId" th:value="${list.id}">
                            <button type="submit" class="btn btn-primary w-100">
                                Take a Quiz
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Trạng thái rỗng được cải tiến -->
    <div th:if="${#lists.isEmpty(lists)}" class="text-center mt-5 p-5 bg-light rounded-3">
        <i class="bi bi-journal-x" style="font-size: 4rem; color: #6c757d;"></i>
        <h2 class="mt-3">Your Lists are Empty</h2>
        <p class="lead text-muted">You haven't created any vocabulary lists yet.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg mt-3">
            <i class="bi bi-search me-2"></i> Find Your First Word
        </a>
    </div>
</main>

<div th:replace="~{fragments/_footer :: page_footer}"></div>
<div th:replace="~{fragments/_footer :: bootstrap_script}"></div>
<div th:replace="~{fragments/_footer :: toast_logic}"></div>

</body>
</html>
