<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/_header :: page_head('Quiz in Progress')}"></head>

<body class="quiz-page">
<div th:replace="~{fragments/_header :: navbar}"></div>

<main class="quiz-container py-4">
    <div class="progress mb-4" style="height: 20px;">
        <div id="quiz-progress-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
    </div>

    <div id="questions-wrapper">
        <div th:each="question, iterStat : ${questions}" class="card shadow-sm question-card" th:classappend="${iterStat.index > 0} ? 'd-none' : ''" th:data-question-index="${iterStat.index}">
            <div class="card-body p-4">
                <div th:switch="${question.type}">
                    <div th:case="${T(com.yourname.vocabularyapp.dto.QuizQuestionDto.QuestionType).MULTIPLE_CHOICE}">
                        <p class="lead">What is the word for: <b th:text="'\'' + ${question.questionText} + '\''"></b></p>
                        <div class="options-container mt-4" th:data-correct-answer="${question.correctAnswer}">
                            <div th:each="option : ${question.options}" class="quiz-option" th:text="${option}" th:data-option-value="${option}"></div>
                        </div>
                    </div>
                    <div th:case="${T(com.yourname.vocabularyapp.dto.QuizQuestionDto.QuestionType).FILL_IN_THE_BLANK}">
                        <p class="lead">Fill in the blank:</p>
                        <p class="fst-italic bg-light p-3 rounded" th:text="${question.questionText}"></p>
                        <div class="input-group mt-4">
                            <input type="text" class="form-control" placeholder="Your answer...">
                            <button class="btn btn-primary check-answer-btn" th:data-correct-answer="${question.correctAnswer}">Check</button>
                        </div>
                        <div class="feedback-message mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="quiz-navigation" class="mt-4 text-end d-none">
        <button id="next-question-btn" class="btn btn-lg btn-success">Next Question &rarr;</button>
    </div>

    <!-- Form ẩn để submit kết quả cuối cùng -->
    <form id="finish-quiz-form" th:action="@{/quiz/submit}" method="post" class="d-none"></form>
</main>

<div th:replace="~{fragments/_footer :: page_footer}"></div>
<div th:replace="~{fragments/_footer :: bootstrap_script}"></div>
<div th:replace="~{fragments/_footer :: toast_logic}"></div>
<script th:src="@{/js/quiz-handler.js}"></script>
</body>
</html>
