<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<h1>Start a New Quiz</h1>
<a th:href="@{/}">Back to Home</a>

<div th:if="${param.error}" style="color:red;" th:text="${param.error}"></div>

<form th:action="@{/quiz/start}" method="post">
    <label for="listId">Choose a list to practice:</label>
    <select name="listId" id="listId" required>
        <option th:each="list : ${lists}" th:value="${list.id}" th:text="${list.name}">List Name</option>
    </select>
    <button type="submit">Start Quiz</button>
</form>
</body>
</html>
