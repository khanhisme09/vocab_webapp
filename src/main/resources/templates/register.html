<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/_header :: page_head('Register')}"></head>

<body>

<div th:replace="~{fragments/_header :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center mt-4">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">
                    <h2 class="card-title text-center mb-4">Create Your Account</h2>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Username or email already exists!
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Username" required>
                            <label for="username">Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a th:href="@{/login}" class="fw-bold">Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/_footer :: page_footer}"></div>
</body>
</html>
